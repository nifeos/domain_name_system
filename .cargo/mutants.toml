# cargo-mutants configuration, read from the crate root.
#
# `mod proofs` in src/lib.rs is `#[cfg(kani)]`, so `cargo test` never compiles it: a change to
# it cannot fail any test, and every mutant of it survives for that reason alone. Kani checks its
# proofs in CI, and each proof carries a falsification patch under falsifications/ that must make
# Kani fail. That is the module's mutation testing.
#
# The module has a file of its own that holds nothing else, so a glob excludes exactly it. The
# helpers it defines for the proofs are excluded with it, since they are compiled only under Kani.
exclude_globs = ["src/proofs.rs"]
